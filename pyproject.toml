[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-rl-ops"
version = "0.1.0"
description = "Reproducible reinforcement learning for constrained multi-SKU inventory replenishment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.29,<1"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
inventory-rl = "inventory_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
